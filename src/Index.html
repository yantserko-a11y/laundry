<!DOCTYPE html>
<html lang="ru">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Запись на стирку</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #16181d; --muted: #6b7280; --line: #e5e7eb;
    --free: #fff; --free-line: #d1d5db; --sel: #2563eb; --sel-text: #fff;
    --taken: #eef0f3; --taken-text: #9ca3af; --mine: #dcfce7; --mine-line: #16a34a; --mine-text: #166534;
    --danger: #dc2626; --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #181b21; --text: #e8eaee; --muted: #9aa1ad; --line: #2a2f38;
      --free: #181b21; --free-line: #3a404b; --taken: #22262e; --taken-text: #5f6673;
      --mine: #12351f; --mine-line: #22c55e; --mine-text: #86efac; --accent: #60a5fa; --sel: #3b82f6;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 120px; }
  h1 { font-size: 22px; margin: 4px 0 2px; }
  .sub { color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 14px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input[type=text] { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--free-line); border-radius: 10px; background: var(--card); color: var(--text); }
  .row2 { display: grid; grid-template-columns: 1fr 110px; gap: 10px; }
  .me { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .link { background: none; border: 0; color: var(--accent); font: inherit; padding: 0; cursor: pointer; }
  table { width: 100%; border-collapse: separate; border-spacing: 5px; table-layout: fixed; margin: -5px; width: calc(100% + 10px); }
  th { font-size: 12px; font-weight: 600; color: var(--muted); padding: 2px 0; }
  th.slot { text-align: left; width: 58px; font-weight: 500; line-height: 1.15; }
  th.slot b { display: block; color: var(--text); font-size: 14px; }
  td button { width: 100%; height: 44px; border-radius: 10px; border: 1px solid var(--free-line); background: var(--free); color: var(--text); font: 600 12px/1.1 inherit; cursor: pointer; padding: 0; }
  td button.sel { background: var(--sel); border-color: var(--sel); color: var(--sel-text); }
  td button.taken { background: var(--taken); border-color: transparent; color: var(--taken-text); cursor: pointer; font-weight: 500; }
  td button.mine { background: var(--mine); border-color: var(--mine-line); color: var(--mine-text); }
  td button.closed { background: transparent; border: 1px dashed var(--line); color: transparent; cursor: default; }
  .days { display: flex; gap: 6px; overflow-x: auto; margin: 0 -14px 12px; padding: 0 14px 2px; scrollbar-width: none; }
  .days::-webkit-scrollbar { display: none; }
  .day { flex: none; border: 1px solid var(--free-line); background: var(--card); color: var(--text); border-radius: 10px; padding: 6px 10px; font: 500 13px/1.2 inherit; cursor: pointer; text-align: center; min-width: 52px; position: relative; }
  .day b { display: block; font-size: 15px; }
  .day.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .day .dot { position: absolute; top: 4px; right: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--sel); }
  .day .dot.mine { background: var(--mine-line); right: 13px; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .lang { display: flex; border: 1px solid var(--free-line); border-radius: 9px; overflow: hidden; flex: none; margin-top: 6px; }
  .lang button { background: none; border: 0; color: var(--muted); font: 600 12px inherit; padding: 6px 9px; cursor: pointer; }
  .lang button.on { background: var(--text); color: var(--bg); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 12px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -2px; margin-right: 5px; border: 1px solid var(--free-line); }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .bar .in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .bar .sum { flex: 1; font-size: 14px; }
  .bar .sum b { font-size: 16px; }
  .btn { font: 600 15px inherit; border: 0; border-radius: 12px; padding: 13px 18px; background: var(--accent); color: #fff; cursor: pointer; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  .btn.danger { background: var(--danger); }
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet-bg.open { display: flex; }
  .sheet { background: var(--card); width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); max-height: 90vh; overflow: auto; }
  .sheet h2 { font-size: 18px; margin: 0 0 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip { background: var(--taken); border-radius: 8px; padding: 4px 8px; font-size: 13px; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--text); margin: 12px 0; cursor: pointer; }
  .check input { width: 20px; height: 20px; margin: 0; flex: none; }
  .file { font-size: 13px; color: var(--muted); }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  .actions .btn { flex: 1; }
  .toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 20; display: none; max-width: calc(100% - 32px); }
  .err { color: var(--danger); font-size: 13px; margin-top: 8px; }
  .loading { color: var(--muted); padding: 30px 0; text-align: center; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1 data-i18n="title">Запись на стирку</h1>
    <div class="lang" role="group" aria-label="Язык / Language">
      <button data-lang="ru">RU</button><button data-lang="en">EN</button>
    </div>
  </div>
  <div class="sub" data-i18n="subtitle">Запись открыта до ближайшего воскресенья включительно</div>

  <div class="card" id="profile"></div>

  <div class="card">
    <div class="days" id="days"></div>
    <div id="grid" class="loading" data-i18n="loading">Загружаю слоты…</div>
    <div class="legend">
      <span><i></i><span data-i18n="lgFree">свободно</span></span>
      <span><i style="background:var(--sel);border-color:var(--sel)"></i><span data-i18n="lgSel">выбрано</span></span>
      <span><i style="background:var(--mine);border-color:var(--mine-line)"></i><span data-i18n="lgMine">моё — нажми, чтобы отменить</span></span>
      <span><i style="background:var(--taken);border-color:transparent"></i><span data-i18n="lgTaken">занято (номер комнаты)</span></span>
    </div>
    <div class="hint" data-i18n="hint">Нажми на занятую ячейку — покажем, кто записан.</div>
  </div>
</div>

<div class="bar"><div class="in">
  <div class="sum" id="sum">Выбери ячейки в таблице</div>
  <button class="btn" id="go" disabled data-i18n="book">Записаться</button>
</div></div>

<div class="sheet-bg" id="confirmBg"><div class="sheet">
  <h2 data-i18n="confirmTitle">Подтвердить запись</h2>
  <div class="chips" id="chips"></div>
  <div><b id="total"></b> <span class="sub" id="perWash"></span></div>
  <div style="margin-top:12px">
    <label for="receipt" data-i18n="receipt">Квитанция об оплате</label>
    <input type="file" id="receipt" accept="image/*,application/pdf" class="file">
  </div>
  <label class="check"><input type="checkbox" id="consent">
    <span data-i18n="consent">Выражаю согласие, что за предоставление заведомо подложных документов и информации несу дисциплинарную ответственность</span></label>
  <div class="err" id="bookErr"></div>
  <div class="actions">
    <button class="btn ghost" id="cancelConfirm" data-i18n="back">Назад</button>
    <button class="btn" id="doBook" data-i18n="book">Записаться</button>
  </div>
</div></div>

<div class="sheet-bg" id="undoBg"><div class="sheet">
  <h2 data-i18n="undoTitle">Отменить запись?</h2>
  <div id="undoText" class="sub"></div>
  <div class="err" id="undoErr"></div>
  <div class="actions">
    <button class="btn ghost" id="undoBack" data-i18n="keep">Оставить</button>
    <button class="btn danger" id="doUndo" data-i18n="cancel">Отменить</button>
  </div>
</div></div>

<div class="toast" id="toast"></div>

<script>
// ---------- локальное хранилище (может быть недоступно) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('laundry.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('laundry.' + k, JSON.stringify(v)); } catch (e) {} },
};
let deviceId = store.get('device', null);
if (!deviceId) {
  deviceId = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now());
  store.set('device', deviceId);
}

// ---------- языки ----------
const I18N = {
  ru: {
    title: 'Запись на стирку', subtitle: 'Запись открыта до ближайшего воскресенья включительно', loading: 'Загружаю слоты…',
    lgFree: 'свободно', lgSel: 'выбрано', lgMine: 'моё — нажми, чтобы отменить', lgTaken: 'занято (номер комнаты)', hint: 'Нажми на занятую ячейку — покажем, кто записан.',
    book: 'Записаться', booking: 'Записываю…', confirmTitle: 'Подтвердить запись', receipt: 'Квитанция об оплате',
    consent: 'Выражаю согласие, что за предоставление заведомо подложных документов и информации несу дисциплинарную ответственность',
    back: 'Назад', undoTitle: 'Отменить запись?', keep: 'Оставить', cancel: 'Отменить',
    name: 'Фамилия и имя', namePh: 'Иванова Мария', room: 'Комната', remember: 'Запомним на этом телефоне — в следующий раз вводить не придётся.',
    edit: 'Изменить', roomN: n => 'комната ' + n, today: 'сегодня', tomorrow: 'завтра', wd: ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'],
    locale: 'ru-RU', machine: n => 'машинка №' + n, who: (name, room) => `${name}, комната ${room}`, mine: 'моё', ariaMine: 'моя запись', ariaTaken: 'занято', ariaPast: 'прошло', ariaSel: 'выбрано',
    selected: (n, sum) => `Выбрано: <b>${n}</b> · ${sum} ₽`, pick: 'Выбери ячейки в таблице', fill: 'Заполни имя и комнату',
    total: sum => `Итого: ${sum} ₽`, perWash: p => `(${p} ₽ за стирку)`, tickConsent: 'Поставь галочку согласия.',
    done: 'Готово, записано ✓', conflict: list => `Кто-то успел раньше: ${list}. Выбери другие.`, cancelled: 'Запись отменена',
    loadFail: 'Не удалось загрузить: ', readFail: 'Не удалось прочитать файл.',
    ERR_PROFILE: 'Укажи фамилию, имя и номер комнаты.', ERR_CONSENT: 'Нужно согласие об ответственности за подложные документы.',
    ERR_EMPTY: 'Выбери хотя бы одну ячейку.', ERR_NOT_MINE: 'Отменить запись можно только с того телефона, с которого записывались.',
    ERR_FILE_SIZE: 'Квитанция больше 8 МБ — сожми или сделай скриншот.',
  },
  en: {
    title: 'Laundry booking', subtitle: 'Booking is open up to and including the coming Sunday', loading: 'Loading slots…',
    lgFree: 'free', lgSel: 'selected', lgMine: 'mine — tap to cancel', lgTaken: 'taken (room number)', hint: 'Tap a taken cell to see who booked it.',
    book: 'Book', booking: 'Booking…', confirmTitle: 'Confirm booking', receipt: 'Payment receipt',
    consent: 'I agree that I am responsible for the provision of knowingly forged documents and information',
    back: 'Back', undoTitle: 'Cancel booking?', keep: 'Keep', cancel: 'Cancel',
    name: 'Last name and first name', namePh: 'Ivanova Maria', room: 'Room', remember: 'Saved on this phone — you won’t need to type it again.',
    edit: 'Edit', roomN: n => 'room ' + n, today: 'today', tomorrow: 'tomorrow', wd: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
    locale: 'en-GB', machine: n => 'machine #' + n, who: (name, room) => `${name}, room ${room}`, mine: 'mine', ariaMine: 'my booking', ariaTaken: 'taken', ariaPast: 'past', ariaSel: 'selected',
    selected: (n, sum) => `Selected: <b>${n}</b> · ${sum} ₽`, pick: 'Pick cells in the table', fill: 'Enter your name and room',
    total: sum => `Total: ${sum} ₽`, perWash: p => `(${p} ₽ per wash)`, tickConsent: 'Please tick the consent box.',
    done: 'Done, you’re booked ✓', conflict: list => `Someone was faster: ${list}. Pick other cells.`, cancelled: 'Booking cancelled',
    loadFail: 'Could not load: ', readFail: 'Could not read the file.',
    ERR_PROFILE: 'Enter your last name, first name and room number.', ERR_CONSENT: 'Consent about forged documents is required.',
    ERR_EMPTY: 'Pick at least one cell.', ERR_NOT_MINE: 'A booking can only be cancelled from the phone it was made on.',
    ERR_FILE_SIZE: 'The receipt is over 8 MB — compress it or take a screenshot.',
  },
};
let lang = store.get('lang', null) || ((navigator.language || '').toLowerCase().startsWith('ru') ? 'ru' : 'en');
const T = () => I18N[lang];
// Ошибки бэкенда приходят кодами ERR_*, переводим их; остальное показываем как есть
const errText = e => { const m = String(e && e.message || e).match(/ERR_[A-Z_]+/); return m && T()[m[0]] ? T()[m[0]] : String(e && e.message || e); };

function applyLang() {
  document.documentElement.lang = lang;
  document.title = T().title;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T()[el.dataset.i18n]; });
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  renderProfile();
  if (state) renderGrid();
}
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { lang = b.dataset.lang; store.set('lang', lang); applyLang(); });

// ---------- вызов бэкенда ----------
// Внутри Apps Script — google.script.run; на GitHub Pages — fetch к веб-приложению без cookies Google
const API_URL = 'https://script.google.com/macros/s/AKfycbx0ZgqzJRiuFUDiF7XprkQcve19oIhvDXlNq8Top7QLdTUy67wMFeqOhRVYzm-RmeTsdw/exec';
async function call(fn, ...args) {
  if (typeof google !== 'undefined' && google.script) {
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(e => reject(e && e.message ? e : new Error(String(e))))[fn](...args);
    });
  }
  let res;
  if (fn === 'getState') {
    res = await fetch(`${API_URL}?action=state&device=${encodeURIComponent(args[0])}&t=${Date.now()}`, { credentials: 'omit' });
  } else {
    const body = fn === 'book' ? { action: 'book', ...args[0] } : { action: 'cancel', deviceId: args[0], id: args[1] };
    res = await fetch(API_URL, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  }
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data.result;
}

let state = null;
let selected = new Set(); // ключи "date#slot#machine"
let day = null; // выбранный день dd.MM.yyyy
let profile = store.get('profile', { name: '', room: '' });
let editingProfile = !profile.name || !profile.room;
let undoId = null;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const key = (date, slot, m) => date + '#' + slot + '#' + m;
const toDate = s => { const [d, m, y] = s.split('.'); return new Date(+y, +m - 1, +d); };
const isClosed = (date, slot) => date === state.today && state.closed.includes(slot);
function dayLabel(date) {
  if (date === state.today) return T().today;
  if (date === state.days[1]) return T().tomorrow;
  return toDate(date).toLocaleDateString(T().locale, { weekday: 'long', day: 'numeric', month: 'long' });
}

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 3200);
}

// ---------- профиль ----------
function renderProfile() {
  const el = $('profile');
  if (editingProfile) {
    el.innerHTML = `
      <div class="row2">
        <div><label for="name">${T().name}</label><input type="text" id="name" autocomplete="name" placeholder="${T().namePh}"></div>
        <div><label for="room">${T().room}</label><input type="text" id="room" inputmode="numeric" placeholder="412"></div>
      </div>
      <div class="sub" style="margin-top:8px">${T().remember}</div>`;
    $('name').value = profile.name; $('room').value = profile.room;
    $('name').oninput = $('room').oninput = () => {
      profile = { name: $('name').value.trim(), room: $('room').value.trim() };
      store.set('profile', profile); updateBar();
    };
  } else {
    el.innerHTML = `<div class="me"><div><b></b> <span class="sub"></span></div><button class="link" id="edit">${T().edit}</button></div>`;
    el.querySelector('b').textContent = profile.name;
    el.querySelector('.sub').textContent = T().roomN(profile.room);
    $('edit').onclick = () => { editingProfile = true; renderProfile(); $('name').focus(); };
  }
}

// ---------- сетка ----------
function renderGrid() {
  if (!state) return;
  if (!state.days.includes(day)) day = state.today;

  const taken = {};
  state.taken.forEach(t => taken[key(t.date, t.slot, t.machine)] = t);
  // выбранное, которое успели занять, которое уже прошло или день которого закрылся, снимаем
  [...selected].forEach(k => { const [d, s] = k.split('#'); if (taken[k] || !state.days.includes(d) || isClosed(d, s)) selected.delete(k); });

  // вкладки дней: синяя точка — есть выбранное, зелёная — есть мои записи
  $('days').innerHTML = state.days.map(d => {
    const dt = toDate(d);
    const sel = [...selected].some(k => k.startsWith(d + '#'));
    const mine = state.taken.some(t => t.date === d && t.mine);
    const top = d === state.today ? T().today : T().wd[dt.getDay()];
    return `<button class="day${d === day ? ' on' : ''}" data-d="${d}">${top}<b>${dt.getDate()}</b>` +
      (mine ? '<span class="dot mine"></span>' : '') + (sel ? '<span class="dot"></span>' : '') + '</button>';
  }).join('');
  $('days').querySelectorAll('.day').forEach(b => b.onclick = () => { day = b.dataset.d; renderGrid(); });

  let html = '<table><thead><tr><th class="slot"></th>';
  for (let mc = 1; mc <= state.machines; mc++) html += `<th>№${mc}</th>`;
  html += '</tr></thead><tbody>';
  state.slots.forEach(slot => {
    const [a, b] = slot.split('-');
    const closed = isClosed(day, slot);
    html += `<tr><th class="slot"><b>${a}</b>–${b}</th>`;
    for (let mc = 1; mc <= state.machines; mc++) {
      const k = key(day, slot, mc), t = taken[k];
      let cls = '', label = '', title = '', aria = `${slot}, ${T().machine(mc)}`;
      if (t && t.mine) { cls = 'mine'; label = T().mine; aria += ', ' + T().ariaMine; }
      else if (t) { cls = 'taken'; label = esc(t.room); title = esc(T().who(t.name, t.room)); aria += ', ' + T().ariaTaken + ': ' + title; }
      else if (closed) { cls = 'closed'; aria += ', ' + T().ariaPast; }
      else if (selected.has(k)) { cls = 'sel'; label = '✓'; aria += ', ' + T().ariaSel; }
      html += `<td><button class="${cls}" data-k="${k}" aria-label="${aria}"${title ? ` title="${title}"` : ''}>${label}</button></td>`;
    }
    html += '</tr>';
  });
  html += '</tbody></table>';
  const g = $('grid'); g.className = ''; g.innerHTML = html;
  g.querySelectorAll('button').forEach(btn => btn.onclick = () => onCell(btn.dataset.k));
  updateBar();
}

function onCell(k) {
  const t = state.taken.find(x => key(x.date, x.slot, x.machine) === k);
  if (t && t.mine) return openUndo(t);
  // Чужая запись: показываем, кто записан
  if (t) return toast(`${T().who(t.name, t.room)} · ${dayLabel(t.date)}, ${t.slot}, ${T().machine(t.machine)}`);
  const [d, s] = k.split('#');
  if (isClosed(d, s)) return;
  selected.has(k) ? selected.delete(k) : selected.add(k);
  renderGrid();
}

function updateBar() {
  const n = selected.size;
  const ready = profile.name && profile.room;
  $('sum').innerHTML = n ? T().selected(n, n * (state ? state.price : 50)) : (ready ? T().pick : T().fill);
  $('go').disabled = !n || !ready;
}

// ---------- запись ----------
function sortedCells() {
  const order = s => state.slots.indexOf(s);
  return [...selected].map(k => { const [date, slot, m] = k.split('#'); return { date, slot, machine: +m }; })
    .sort((a, b) => state.days.indexOf(a.date) - state.days.indexOf(b.date) || order(a.slot) - order(b.slot) || a.machine - b.machine);
}

$('go').onclick = () => {
  if (editingProfile && profile.name && profile.room) { editingProfile = false; renderProfile(); }
  const cells = sortedCells();
  $('chips').innerHTML = '';
  cells.forEach(c => { const s = document.createElement('span'); s.className = 'chip'; s.textContent = `${dayLabel(c.date)}, ${c.slot} · ${T().machine(c.machine)}`; $('chips').appendChild(s); });
  $('total').textContent = T().total(cells.length * state.price);
  $('perWash').textContent = T().perWash(state.price);
  $('consent').checked = store.get('consent', false);
  $('bookErr').textContent = '';
  $('confirmBg').classList.add('open');
};
$('cancelConfirm').onclick = () => $('confirmBg').classList.remove('open');

function readFile(file) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve(null);
    if (file.size > 8 * 1024 * 1024) return reject(new Error('ERR_FILE_SIZE'));
    const r = new FileReader();
    r.onload = () => resolve({ name: file.name, mime: file.type, base64: String(r.result).split(',')[1] });
    r.onerror = () => reject(new Error(T().readFail));
    r.readAsDataURL(file);
  });
}

$('doBook').onclick = async () => {
  const btn = $('doBook');
  if (!$('consent').checked) { $('bookErr').textContent = T().tickConsent; return; }
  store.set('consent', true);
  btn.disabled = true; btn.textContent = T().booking; $('bookErr').textContent = '';
  try {
    const receipt = await readFile($('receipt').files[0]);
    const res = await call('book', { deviceId, name: profile.name, room: profile.room, consent: true, cells: sortedCells(), receipt });
    state = res.state;
    if (res.ok) {
      selected.clear(); $('receipt').value = '';
      $('confirmBg').classList.remove('open');
      toast(T().done);
    } else {
      $('confirmBg').classList.remove('open');
      toast(T().conflict(res.conflicts.map(c => `${dayLabel(c.date)} ${c.slot} ${T().machine(c.machine)}`).join(', ')));
    }
    renderGrid();
  } catch (e) {
    $('bookErr').textContent = errText(e);
  } finally {
    btn.disabled = false; btn.textContent = T().book;
  }
};

// ---------- отмена ----------
function openUndo(t) {
  undoId = t.id;
  $('undoText').textContent = `${dayLabel(t.date)}, ${t.slot}, ${T().machine(t.machine)}`;
  $('undoErr').textContent = '';
  $('undoBg').classList.add('open');
}
$('undoBack').onclick = () => $('undoBg').classList.remove('open');
$('doUndo').onclick = async () => {
  const btn = $('doUndo'); btn.disabled = true;
  try {
    state = await call('cancel', deviceId, undoId);
    $('undoBg').classList.remove('open');
    toast(T().cancelled);
    renderGrid();
  } catch (e) { $('undoErr').textContent = errText(e); }
  finally { btn.disabled = false; }
};

document.querySelectorAll('.sheet-bg').forEach(bg => bg.addEventListener('click', e => { if (e.target === bg) bg.classList.remove('open'); }));

// ---------- загрузка и автообновление ----------
async function refresh() {
  try { state = await call('getState', deviceId); renderGrid(); }
  catch (e) { if (!state) $('grid').textContent = T().loadFail + errText(e); }
}
applyLang();
refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
